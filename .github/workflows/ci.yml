name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Create .env for the test run
        run: |
          sed -e "s/^POSTGRES_SUPERUSER_PASSWORD=CHANGE_ME/POSTGRES_SUPERUSER_PASSWORD=ci$RANDOM$RANDOM/" \
              -e "s/^APP_DB_PASSWORD=CHANGE_ME/APP_DB_PASSWORD=ci$RANDOM$RANDOM/" .env.example > .env
          docker compose config --quiet

      - name: Build images
        run: |
          docker compose build api
          docker compose --profile tools build tests

      - name: Lint
        run: docker compose run --rm --no-deps tests sh -c "ruff check . && ruff format --check ."

      - name: Tests (PostgreSQL + pgvector, offline model fakes)
        run: docker compose run --rm tests

      - name: Image starts
        run: docker compose run --rm --no-deps api python -c "import app.main, pytesseract; print(pytesseract.get_tesseract_version())"

      - name: Logs on failure
        if: failure()
        run: docker compose logs db
